# Feature 2: "Ctrl+F for a slide". Each key is a name shown in the app dropdown.
# Each list has synonyms. The code averages their embeddings (a prompt ensemble).
templates:
  - "an H&E image of {}."
  - "a histopathology image showing {}."

phrases:
  tumor_cells:
    - "tumor cells"
    - "invasive carcinoma"
  necrosis:
    - "necrosis"
    - "dead tissue with loss of cellular detail"
  lymphocytes:
    - "tumor-infiltrating lymphocytes"
    - "dense immune cell infiltrate"
  stroma:
    - "fibrous stroma"
    - "connective tissue"
  glands:
    - "glandular structures"
    - "well-formed glands"
  mitoses:
    - "mitotic figures"
    - "dividing cells"
  normal_tissue:
    - "normal tissue"
    - "benign tissue"
  fat:
    - "adipose tissue"
    - "fat cells"
  epithelium:
    - "epidermis"
    - "endothelium"
    - "mesothelium"
  lumen:
    - "cavity"
    - "hollow"
  goblet_cell:
    - "caliciform cell"
    - "mucous glands"
  collagen:
    - "fibrous protein"
    - "structural protein"
  glia:
    - "sustentacular tissue"
    - "neuroglia"
  extracellular_matrix:
    - "interstitial matrix"
    - "basement membrane"
  fibroblast:
    - "reticular cell"
    - "myofibroblast"
  dysplasia:
    - "abnormality"
    - "intraepithelial neoplasia"
  hyperchromasia:
    - "hyperchromia"
    - "hyperchromaticity"
    
